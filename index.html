<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ays Pottery – Ödeme Bilgileri</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe8;--card:#fbf8f4;--text:#2b2420;--muted:#857a70;--line:#e2d9ce;--accent:#a8583b;--accent-d:#8a452c;--on-accent:#fff;--ok:#3f7d58;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1714;--card:#252019;--text:#f1e9df;--muted:#a89c90;--line:#3a322b;--accent:#d08463;--accent-d:#e0987a;--on-accent:#1b1714;--ok:#7fc79b}}
:root[data-theme="dark"]{--bg:#1b1714;--card:#252019;--text:#f1e9df;--muted:#a89c90;--line:#3a322b;--accent:#d08463;--accent-d:#e0987a;--on-accent:#1b1714;--ok:#7fc79b}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:44px 22px 36px}
.brand{text-align:center}
.vase{width:34px;height:46px;color:var(--accent)}
.name{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:46px;font-weight:600;letter-spacing:10px;margin:10px 0 0 10px;line-height:1}
.tag{font-size:11px;letter-spacing:6px;text-transform:uppercase;color:var(--muted);margin:10px 0 0 6px}
.rule{width:40px;height:1px;background:var(--accent);margin:30px auto}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:26px;text-align:center;margin:0 0 6px}
.lead{text-align:center;color:var(--muted);font-size:14px;margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 22px;margin-bottom:16px}
.bank{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.bank b{font-size:16px;font-weight:600}
.chip{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:99px;padding:3px 10px}
.lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.val{font-size:16px;font-weight:500;margin-bottom:18px;word-break:break-word}
.iban{font-size:17px;letter-spacing:.8px;font-variant-numeric:tabular-nums;font-weight:600;margin-bottom:20px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:12px;padding:15px;font:600 15px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:none;transition:background .2s}
.copy{background:var(--accent);color:var(--on-accent);border:0}
.copy:hover{background:var(--accent-d)}
.copy.ok{background:var(--ok);color:#fff}
.note{font-size:12.5px;color:var(--muted);text-align:center;margin:0 10px 26px}
.ig{background:transparent;color:var(--text);border:1px solid var(--line)}
.ig:hover{border-color:var(--accent);color:var(--accent)}
.ig svg{width:18px;height:18px}
footer{text-align:center;color:var(--muted);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <svg class="vase" viewBox="0 0 48 64" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 5h14M19.5 5v9c0 5-10 9-10 23 0 13 8 21 14.500 21s14.500-8 14.500-21c0-14-10-18-10-23V5"/></svg>
    <div class="name">AYS</div>
    <div class="tag">Pottery</div>
  </header>

  <div class="rule"></div>

  <h1>Ödeme Bilgileri</h1>
  <p class="lead">Havale / EFT ile ödemenizi aşağıdaki hesaba yapabilirsiniz.</p>

  <div id="accounts"></div>

  <p class="note">Ödeme öncesinde hesap sahibi adını kontrol etmenizi öneririz.</p>

  <a class="btn ig" href="https://www.instagram.com/ayspottery" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.500" cy="6.500" r=".8" fill="currentColor"/></svg>
    @ayspottery
  </a>

  <footer>Ays Pottery</footer>
</div>

<script>
// IBAN bilgilerini buraya ekleyin. Birden fazla hesap için yeni bir satır eklemeniz yeterli.
var ACCOUNTS = [
  { banka: "Kuveyt Türk", hesapSahibi: "Ayşe Nur Taşdan", iban: "TR05 0020 5000 0995 9236 0000 01" }
];

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

var html = "";
ACCOUNTS.forEach(function(a,i){
  html += '<section class="card">' +
    '<div class="bank"><b>' + esc(a.banka) + '</b><span class="chip">IBAN</span></div>' +
    '<div class="lbl">Hesap Sahibi</div><div class="val">' + esc(a.hesapSahibi) + '</div>' +
    '<div class="lbl">IBAN</div><div class="iban">' + esc(a.iban) + '</div>' +
    '<button class="btn copy" data-i="' + i + '">IBAN’ı Kopyala</button>' +
    '</section>';
});
document.getElementById("accounts").innerHTML = html;

function fallbackCopy(text){
  var t = document.createElement("textarea");
  t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
  document.body.appendChild(t); t.focus(); t.select();
  try { document.execCommand("copy"); } catch(e) {}
  document.body.removeChild(t);
}

document.querySelectorAll(".copy").forEach(function(btn){
  btn.addEventListener("click", function(){
    var text = ACCOUNTS[btn.dataset.i].iban.replace(/\s+/g,"");
    var done = function(){
      btn.classList.add("ok"); btn.textContent = "✓ Kopyalandı";
      setTimeout(function(){ btn.classList.remove("ok"); btn.textContent = "IBAN’ı Kopyala"; }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function(){ fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  });
});
</script>
</body>
</html>
